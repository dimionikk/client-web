<!DOCTYPE html>
<html lang="uk">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description"
        content="Каталог гаджетів і техніки: телефони, ноутбуки, навушники з цінами та характеристиками">
    <title>Каталог гаджетів і техніки</title>
</head>

<body>
    <header id="site-header">
        <p class="site-name">GadgetHub</p>
        <nav aria-label="Головна навігація">
            <ul>
                <li><a href="#catalog">Каталог</a></li>
                <li><a href="#filters">Фільтри</a></li>
                <li><a href="#contacts">Контакти</a></li>
            </ul>
        </nav>
    </header>

    <main id="main">
        <h1>Каталог гаджетів і техніки</h1>

        <section id="filters" aria-labelledby="filters-title">
            <h2 id="filters-title">Фільтри</h2>
            <form id="filter-form">
                <p>
                    <label for="search">Пошук за назвою</label>
                    <input type="search" id="search" name="q">
                </p>

                <fieldset>
                    <legend>Тип пристрою</legend>
                    <p>
                        <input type="checkbox" id="type-phone" name="type" value="phone">
                        <label for="type-phone">Телефон</label>
                    </p>
                    <p>
                        <input type="checkbox" id="type-laptop" name="type" value="laptop">
                        <label for="type-laptop">Ноутбук</label>
                    </p>
                    <p>
                        <input type="checkbox" id="type-headphones" name="type" value="headphones">
                        <label for="type-headphones">Навушники</label>
                    </p>
                </fieldset>

                <p>
                    <label for="sort">Сортувати</label>
                    <select id="sort" name="sort">
                        <option value="name">за назвою</option>
                        <option value="price">за ціною</option>
                        <option value="year">за роком випуску</option>
                    </select>
                </p>

                <p>
                    <button type="submit">Застосувати</button>
                </p>
            </form>
        </section>

        <section id="catalog" aria-labelledby="catalog-title">
            <h2 id="catalog-title">Пристрої</h2>
        </section>
    </main>

    <footer id="contacts">
        <p>Email: <a href="mailto:dimionik952@gmail.com">dimionik952@gmail.com</a></p>
        <p>&copy; 2026 Образцов Дмитро</p>
    </footer>
</body>

</html>
